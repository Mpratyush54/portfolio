name: Build & Push Docker Images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'kubernetes/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GHCR_REPOSITORY: ${{ github.repository_owner }}
  # Cluster nodes are aarch64 — always build for arm64
  DOCKER_PLATFORM: linux/arm64

jobs:
  backend:
    name: Build & Push Backend (arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_REPOSITORY }}/portfolio-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=arm64,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  frontend:
    name: Build & Push Frontend (arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_REPOSITORY }}/portfolio-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=arm64,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  # Pin k8s manifests to the new SHA so Argo sees a git change and rolls pods
  bump-manifests:
    name: Bump Argo image tags
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Point deployments at this commit's images
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${SHORT_SHA:0:7}"
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')

          # Immutable image tags
          sed -i "s|image: ghcr.io/.*/portfolio-frontend:.*|image: ghcr.io/${OWNER}/portfolio-frontend:${TAG}|" kubernetes/frontend-deployment.yaml
          sed -i "s|image: ghcr.io/.*/portfolio-backend:.*|image: ghcr.io/${OWNER}/portfolio-backend:${TAG}|" kubernetes/backend-deployment.yaml

          # Force pod-template change even if something else matches (Argo/k8s must roll)
          sed -i "s|portfolio.pratyushes.dev/deploy-sha: \".*\"|portfolio.pratyushes.dev/deploy-sha: \"${TAG}\"|" kubernetes/frontend-deployment.yaml
          sed -i "s|portfolio.pratyushes.dev/deploy-sha: \".*\"|portfolio.pratyushes.dev/deploy-sha: \"${TAG}\"|" kubernetes/backend-deployment.yaml

          # Ensure Always so nodes don't keep a stale digest for a retagged name
          sed -i 's|imagePullPolicy: .*|imagePullPolicy: Always|' kubernetes/frontend-deployment.yaml
          sed -i 's|imagePullPolicy: .*|imagePullPolicy: Always|' kubernetes/backend-deployment.yaml

          echo "Pinned manifests to :${TAG} (linux/arm64)"
          grep -E 'image:|deploy-sha:|imagePullPolicy:' kubernetes/frontend-deployment.yaml kubernetes/backend-deployment.yaml

      - name: Commit manifest pin
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: pin k8s images to ${{ github.sha }}"
          file_pattern: 'kubernetes/*-deployment.yaml'
          skip_dirty_check: false
          disable_globbing: true

      # Optional hard refresh if repo secrets ARGOCD_SERVER + ARGOCD_AUTH_TOKEN are set
      - name: Kick Argo CD sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ARGOCD_SERVER}" ] || [ -z "${ARGOCD_AUTH_TOKEN}" ]; then
            echo "No ARGOCD_SERVER / ARGOCD_AUTH_TOKEN secrets — Argo will pick up on its next poll."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://${ARGOCD_SERVER}/api/v1/applications/portfolio?refresh=hard" >/dev/null || true
          curl -fsS -X POST \
            -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"revision":"HEAD","prune":false,"dryRun":false,"strategy":{"hook":{}}}' \
            "https://${ARGOCD_SERVER}/api/v1/applications/portfolio/sync"
          echo "Argo sync requested"
