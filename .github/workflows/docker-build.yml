name: Build & Push Docker Images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'kubernetes/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GHCR_REPOSITORY: ${{ github.repository_owner }}

jobs:
  backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_REPOSITORY }}/portfolio-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_REPOSITORY }}/portfolio-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Pin k8s manifests to the new SHA so Argo sees a git change and rolls pods
  bump-manifests:
    name: Bump Argo image tags
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Point deployments at this commit's images
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          TAG="${SHORT_SHA:0:7}"
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          sed -i "s|image: ghcr.io/.*/portfolio-frontend:.*|image: ghcr.io/${OWNER}/portfolio-frontend:${TAG}|" kubernetes/frontend-deployment.yaml
          sed -i "s|image: ghcr.io/.*/portfolio-backend:.*|image: ghcr.io/${OWNER}/portfolio-backend:${TAG}|" kubernetes/backend-deployment.yaml
          echo "Pinned manifests to :${TAG}"
          grep 'image:' kubernetes/frontend-deployment.yaml kubernetes/backend-deployment.yaml

      - name: Commit manifest pin
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: pin k8s images to ${{ github.sha }}"
          file_pattern: 'kubernetes/*-deployment.yaml'
          skip_dirty_check: false
