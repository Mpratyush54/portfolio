name: Build & Push Docker Images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'kubernetes/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GHCR_REPOSITORY: ${{ github.repository_owner }}
  # Cluster nodes are aarch64 — always build for arm64
  DOCKER_PLATFORM: linux/arm64

jobs:
  validate:
    name: Validate manifest publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/test-publish-images.py

  backend:
    needs: validate
    name: Build & Push Backend (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify native ARM runner
        run: test "$(uname -m)" = aarch64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_REPOSITORY }}/portfolio-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=arm64,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=long
            type=ref,event=branch

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=portfolio-backend-arm64
          cache-to: type=gha,mode=max,scope=portfolio-backend-arm64

  frontend:
    needs: validate
    name: Build & Push Frontend (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify native ARM runner
        run: test "$(uname -m)" = aarch64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_REPOSITORY }}/portfolio-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=arm64,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=long
            type=ref,event=branch

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=portfolio-frontend-arm64
          cache-to: type=gha,mode=max,scope=portfolio-frontend-arm64

  # Pin k8s manifests to the new SHA so Argo sees a git change and rolls pods
  bump-manifests:
    name: Bump Argo image tags
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: portfolio-manifest-publish
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Point deployments at this commit's images
        id: publish
        env:
          BUILD_SHA: ${{ github.sha }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          python3 .github/scripts/publish-images.py

      # Optional hard refresh if repo secrets ARGOCD_SERVER + ARGOCD_AUTH_TOKEN are set
      - name: Kick Argo CD sync
        if: steps.publish.outputs.published == 'true'
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ARGOCD_SERVER}" ] || [ -z "${ARGOCD_AUTH_TOKEN}" ]; then
            echo "No ARGOCD_SERVER / ARGOCD_AUTH_TOKEN secrets — Argo will pick up on its next poll."
            exit 0
          fi
          ARGOCD_URL="${ARGOCD_SERVER%/}"
          case "$ARGOCD_URL" in
            https://*) ;;
            http://*) echo 'Argo endpoint must use HTTPS'; exit 1 ;;
            *) ARGOCD_URL="https://${ARGOCD_URL}" ;;
          esac
          curl -fsS --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            "${ARGOCD_URL}/api/v1/applications/portfolio?refresh=hard" >/dev/null
          echo "Argo refreshed; automated sync will reconcile the latest main revision."
