<form
  class="contact-form"
  (ngSubmit)="sendSimple()"
  aria-label="Project enquiry"
  [attr.aria-busy]="status === 'sending'"
>
  @if (status === 'success') {
    <div class="success-state">
      <h2>Enquiry received</h2>
      <p role="status">{{ statusMessage }}</p>
      <button type="button" class="submit-button" (click)="reset()">Send another enquiry</button>
    </div>
  } @else {
    <div class="form-heading">
      <h2>Project enquiry</h2>
      <p>Share a few details to start the conversation.</p>
    </div>
    <label for="contact-reason">Enquiry type</label>
    <select
      id="contact-reason"
      name="intent"
      [(ngModel)]="intent"
      required
      [disabled]="status === 'sending'"
    >
      <option value="freelance">Project enquiry</option>
      <option value="hi">General question</option>
    </select>
    <div class="field-grid">
      <div>
        <label for="contact-name">Your name</label
        ><input
          id="contact-name"
          name="name"
          [(ngModel)]="data.name"
          required
          minlength="2"
          maxlength="100"
          autocomplete="name"
          [disabled]="status === 'sending'"
        />
      </div>
      <div>
        <label for="contact-email">Email address</label
        ><input
          id="contact-email"
          name="email"
          type="email"
          [(ngModel)]="data.email"
          required
          maxlength="254"
          autocomplete="email"
          [disabled]="status === 'sending'"
        />
      </div>
    </div>
    <label for="contact-phone">Phone number <span>(optional)</span></label
    ><input
      id="contact-phone"
      name="phone"
      type="tel"
      [(ngModel)]="data.phone"
      maxlength="40"
      autocomplete="tel"
      [disabled]="status === 'sending'"
    />
    <label for="contact-message">Project details or question</label
    ><textarea
      id="contact-message"
      name="message"
      [(ngModel)]="data.message"
      required
      maxlength="5000"
      rows="5"
      placeholder="What do you need built or reviewed? Include your timeline and any important requirements."
      [disabled]="status === 'sending'"
    ></textarea>
    <div class="hp-field" aria-hidden="true">
      <input name="website" [(ngModel)]="website" tabindex="-1" autocomplete="off" />
    </div>
    @if (statusMessage) {
      <p class="form-error" role="alert">{{ statusMessage }}</p>
    }
    <p class="privacy-note">
      Your details are used to respond to this enquiry. <a routerLink="/privacy">Privacy policy</a>
    </p>
    <button type="submit" class="submit-button" [disabled]="status === 'sending'">
      {{ status === 'sending' ? 'Sending enquiry…' : 'Send enquiry' }}
    </button>
  }
</form>
