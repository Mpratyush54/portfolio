apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: portfolio
    tier: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: portfolio
      tier: backend
  template:
    metadata:
      labels:
        app: portfolio
        tier: backend
      annotations:
        # Rewritten by CI on every main build so the pod template always changes
        portfolio.pratyushes.dev/deploy-sha: "a24ef933c9d70266eadcad0102699d220ab50a32"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: backend
          # Tag is rewritten by CI to the short git SHA after each build
          image: ghcr.io/mpratyush54/portfolio-backend:a24ef933c9d70266eadcad0102699d220ab50a32
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: PORT
              value: "5000"
            - name: TRUST_PROXY_HOPS
              value: "1"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: MONGO_URI
                  optional: true
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: ADMIN_EMAIL
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: ADMIN_PASSWORD
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_SECURE
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: SMTP_SECURE
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: SMTP_PASS
                  optional: true
            - name: CONTACT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: CONTACT_EMAIL
                  optional: true
            - name: BOOKING_EMAIL
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: BOOKING_EMAIL
                  optional: true
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: RAZORPAY_KEY_ID
                  optional: true
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: RAZORPAY_KEY_SECRET
                  optional: true
            - name: RAZORPAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: RAZORPAY_WEBHOOK_SECRET
                  optional: true
            - name: DISCOVERY_FEE_PAISE
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: DISCOVERY_FEE_PAISE
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: portfolio
    tier: backend
spec:
  selector:
    app: portfolio
    tier: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
