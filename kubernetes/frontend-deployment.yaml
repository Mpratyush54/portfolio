apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: portfolio
    tier: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: portfolio
      tier: frontend
  template:
    metadata:
      labels:
        app: portfolio
        tier: frontend
      annotations:
        # Rewritten by CI on every main build so the pod template always changes
        portfolio.pratyushes.dev/deploy-sha: "4fd968a"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          # Tag is rewritten by CI to the short git SHA after each build
          image: ghcr.io/mpratyush54/portfolio-frontend:4fd968a
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: portfolio
    tier: frontend
spec:
  selector:
    app: portfolio
    tier: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
