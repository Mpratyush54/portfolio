apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: portfolio
    tier: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: portfolio
      tier: frontend
  template:
    metadata:
      labels:
        app: portfolio
        tier: frontend
      annotations:
        # Rewritten by CI on every main build so the pod template always changes
        portfolio.pratyushes.dev/deploy-sha: "2122d56b1be9c7d69442c1612bb26db0cf59e1e2"
    spec:
      volumes:
        - name: analytics-config
          configMap:
            name: portfolio-analytics
            optional: true
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          volumeMounts:
            - name: analytics-config
              mountPath: /usr/share/nginx/html/browser/runtime
              readOnly: true
          # Tag is rewritten by CI to the short git SHA after each build
          image: ghcr.io/mpratyush54/portfolio-frontend:2122d56b1be9c7d69442c1612bb26db0cf59e1e2
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: portfolio
    tier: frontend
spec:
  selector:
    app: portfolio
    tier: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
